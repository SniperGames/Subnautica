<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Subnautica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; overflow:hidden; background:#000; }

    /* MENU UI */
    #menu{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      text-align:center;
      color:#e6f0ff;
      font-family:system-ui;
      z-index:20;
    }
    #menu h1{ letter-spacing:3px; margin-bottom:14px; }
    #menu button{
      padding:14px 30px;
      font-size:16px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      background:linear-gradient(180deg,#4fc3ff,#1b5fa7);
      color:#fff;
    }
    #menu button:hover{ filter:brightness(1.15); }
    #crosshair {
      position:fixed; left:50%; top:50%; width:6px; height:6px;
      margin-left:-3px; margin-top:-3px; border-radius:50%;
      background:#ffffffcc; z-index:10
    }
  </style>
</head>
<body>
<div id="menu">
  <h1>SUBNAUTICA</h1>
  <button id="startBtn">START GAME</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ================= MUZYKA MENU =================
const menuMusic = new Audio('menumusic.mp3');
menuMusic.loop = true;
menuMusic.volume = 0.5;
let musicStarted = false;

document.addEventListener('click', () => {
  if (!musicStarted) {
    menuMusic.play();
    musicStarted = true;
  }
}, { once:true });

// ================= SCENA =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ccee); // niebo

// ================= KAMERA =================
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 10, 20);
camera.lookAt(0,0,0);

// ================= RENDERER =================
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ================= ŚWIATŁO =================
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(20, 50, 20);
scene.add(sun);

// ================= WODA =================
const waterGeom = new THREE.PlaneGeometry(200, 200, 128, 128);
waterGeom.rotateX(-Math.PI/2);

const waterMat = new THREE.MeshStandardMaterial({
  color: 0x1fa3c6,
  transparent: true,
  opacity: 0.85,
  roughness: 0.2,
  metalness: 0.1
});

const water = new THREE.Mesh(waterGeom, waterMat);
scene.add(water);

// ================= FALE =================
const pos = water.geometry.attributes.position;
function animateWater(t){
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = Math.sin((x+z)*0.08 + t*0.002) * 0.4;
    pos.setY(i, y);
  }
  pos.needsUpdate = true;
  water.geometry.computeVertexNormals();
}

// ================= LOOP =================
function animate(t){
  requestAnimationFrame(animate);
  animateWater(t);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= START =================
document.getElementById('startBtn').onclick = ()=>{
  menuMusic.pause();
  location.href = 'game.html';
};
</script>
</body>
</html>
